server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML: nunca cachear — el navegador siempre valida con el servidor
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # CSS y JS: cache de 1 hora — se renueva al redeploy
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Imagenes y fuentes locales: cache de 7 dias
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
